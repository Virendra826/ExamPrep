services:
  - type: web
    name: examprep-backend
    env: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=optional --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_DIAGRAM_BUCKET
        value: examprep-diagrams
      - key: SUPABASE_RAW_UPLOAD_BUCKET
        value: examprep-raw-uploads
      - key: SUPABASE_STORAGE_BUCKET
        value: examprep-assets
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: EXTRACTION_ENGINE
        value: hybrid
      - key: HYBRID_RECONCILIATION_THRESHOLD
        value: 0.3
      - key: VISION_PROVIDER
        value: disabled
